  - name: "Haozheng Luo"
    affiliation: "Northwestern University"
    url: "https://www.luor.org/"
    image: "/assets/images/efficient-reasoning-iclr-2027/haozheng-luo.jpg"
    emails: ["hluo@u.northwestern.edu"]
    bio: "Haozheng Luo is a Computer Science Ph.D. student at Northwestern University, advised by Prof. Yan Chen. His research covers AI safety, efficient reasoning, and foundation models across text, vision, speech, and genomics, including attention pruning, quantization robustness, and parameter-efficient adaptation. He is an Adobe Fellow and a DAAD AINeT Fellow, with work at ICML, NeurIPS, ICLR, and USENIX Security. He organized Efficient Spatial Reasoning at ICLR 2026 and Efficient Reasoning at COLM 2026."
  - name: "Yijiang Li"
    affiliation: "UC San Diego"
    url: "https://williamium3000.github.io/"
    image: "/assets/images/efficient-reasoning-iclr-2027/yijiang-li.png"
    emails: ["yijiangli@ucsd.edu"]
    bio: "Yijiang Li is a Ph.D. student at UC San Diego and holds an M.S.E. in Computer Science from Johns Hopkins University. His research studies label- and sample-efficient, robust learning in multimodal, interactive, and 3D embodied environments, with publications at NeurIPS, ICML, ICCV, ICLR, CVPR, and EMNLP. He led Efficient Spatial Reasoning at ICLR 2026 and Multi-Modal Reasoning for Agentic Intelligence at CVPR 2026, and co-organized Efficient Reasoning at COLM 2026 and Computer Vision for Children at CVPR 2026."
  - name: "Chenwei Xu"
    affiliation: "Northwestern University"
    url: "https://chenwei-1999.github.io/"
    image: "/assets/images/efficient-reasoning-iclr-2027/chenwei-xu.png"
    emails: ["cxu@u.northwestern.edu"]
    bio: "Chenwei Xu is a Ph.D. student at Northwestern University working on video understanding, multimodal reasoning, and AI for science. His research emphasizes reliable and interpretable reasoning, including error diagnosis, reasoning verification, and agent-based retrieval in video-language models. He reviews for major machine learning and computer vision conferences and has served as a workshop Area Chair at COLM and CVPR."
  - name: "Weijia Shi"
    affiliation: "University of Washington"
    url: "https://weijiashi.notion.site/swj"
    image: "/assets/images/efficient-reasoning-iclr-2027/weijia-shi.webp"
    emails: ["swj0419@uw.edu"]
    bio: "Weijia Shi is a Ph.D. student at the University of Washington. Her research develops language models with new approaches to data use, including retrieval-augmented models and mixture-of-experts methods for distributed training without pooling data. She led the second, third, and fourth Knowledge-Augmented NLP Workshops and the ACL Mentorship Program."
  - name: "Zhijian Liu"
    affiliation: "UC San Diego"
    url: "https://zhijianliu.com/"
    image: "/assets/images/efficient-reasoning-iclr-2027/zhijian-liu.webp"
    emails: ["zhijian@ucsd.edu"]
    bio: "Zhijian Liu is an assistant professor at UC San Diego and co-founder of Inco AI. He received his Ph.D. and S.M. from MIT and B.Eng. from Shanghai Jiao Tong University. His work connects efficient machine learning algorithms and systems for computer vision, language, and scientific discovery, with oral and spotlight presentations at NeurIPS, ICLR, and CVPR. He received the Qualcomm Innovation Fellowship and Rising Star recognitions, and organized Efficient Spatial Reasoning at ICLR 2026 and Efficient Reasoning at COLM 2026."

