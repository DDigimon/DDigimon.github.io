# Adapted from the latest ICLR 2027 proposal: _ICLR27__efficient_reasoning (5).pdf.
# Public copy omits proposal logistics, demographic labels, and audience forecasts.
title: "Efficient Reasoning"
edition: "The Third Workshop on Efficient Reasoning"
conference: "ICLR 2027"
status: "Proposed workshop"
subtitle: "Across Architectures, Learning, and Agent Systems"
tagline: "Making large reasoning models faster, cheaper, and more efficient."
date: "April 29 or 30, 2027 (assignment TBD)"
location: "San Francisco, CA · Venue TBD"
format: "Hybrid · In-person sessions and online participation"

news:
  - "The proposed third edition brings together efficient reasoning across architectures, learning, and agent systems. Our invited speakers and organizing team are listed below. The assigned workshop date, submission portal, and final program will be announced here."

intro_heading: "Advancing efficient reasoning across architectures, learning, and agent systems."
about:
  - "Reasoning systems increasingly support mathematical problem solving, coding, scientific discovery, and multimodal and embodied decision-making. Their practical value depends on reasoning quality alongside the resources required to learn, execute, and verify solutions. Larger models, longer reasoning traces, and more search or test-time computation can improve capabilities while increasing latency, memory, energy, and deployment costs."
  - "Looped Transformers and recurrent-depth models repeatedly apply shared computational blocks to refine hidden representations, allowing effective depth to vary without separate parameters for every iteration. Recent looped language models, including Ouro, explore latent reasoning and learned depth allocation. Parameter sharing, iterative refinement, and adaptive stopping are promising directions, but fewer parameters or generated tokens do not by themselves establish lower total computation or wall-clock latency."
  - "These architectures complement efficient pretraining and post-training, reasoning-trace compression, reinforcement learning, model routing, adaptive budgets, search, and selective verification. Realizing their benefits requires systems support for dynamic computation, including scheduling, batching, memory reuse, and KV-cache management."
  - "For agents, resource allocation extends to planning, retrieval, memory, tool use, and interaction with other agents and environments. Evaluation must cover complete execution trajectories, including failed attempts, verification, and recovery. Model-internal recurrence and system-level self-improvement are distinct mechanisms; the latter must also account for the costs of generating feedback, evaluating changes, and learning from experience."
  - "The workshop asks how to design, train, and deploy reasoning systems that use computation effectively across internal model iterations and complete agent workflows. We will connect theory, architectures, learning algorithms, systems, agents, and applications, linking expressivity, depth generalization, and learning stability with hardware performance, task success, interpretability, and safety."

driving_questions:
  - title: "How can efficient reasoning make recursive self-improvement practical?"
    description: "What evidence demonstrates improvement of a system's own models, tools, or learning procedures? How should feedback, evaluation, repeated optimization, and productive research decisions be costed, and how does this process differ from recurrent hidden-state updates within a model?"
  - title: "Which dimensions of reasoning efficiency matter most?"
    description: "Consider tokens per problem; latency; compute or monetary cost per correct answer, including failures; memory and KV cache; adaptive allocation across tokens, iterations, search, and verification; training and data efficiency; faithful and monitorable reasoning; and parameter sharing relative to recurrent computation. Which trade-offs matter in each deployment setting?"
  - title: "Can models learn when to think, and how should we measure it?"
    description: "Should benchmarks measure accuracy per dollar or a full quality–resource Pareto curve? Which training data, process feedback, and rewards teach difficulty awareness, avoid premature stopping and unnecessary computation, and help looped models decide whether another iteration is worthwhile?"
  - title: "How should efficiency be balanced with transparency?"
    description: "As reasoning is compressed or moves into latent space, how can faithfulness, readability, and monitorability be maintained? What information must survive in traces, model states, and agent memory, and how can errors or unsafe behavior be detected when internal reasoning is less accessible?"
  - title: "What does efficient reasoning look like under tight budgets?"
    description: "Under strict memory, latency, and power limits, when should a system constrain thinking, distill a smaller model, route hard cases to the cloud, or adapt recurrent depth? How can quality and reliability be preserved while accounting for actual hardware runtime and communication overhead?"
  - title: "What representations and architectures support efficient reasoning?"
    description: "When should systems use natural-language traces, recurrent or latent computation, search, or executable tools? How do these choices affect supervision, verification, and generalization? When does shared recurrent depth provide useful refinement, and when does it amplify errors or become unstable?"
  - title: "How can agents minimize the total cost of successful task completion?"
    description: "How should reasoning, planning, memory, retrieval, and tool use be coordinated over long horizons? Evaluation should include complete trajectories, verification, communication, failures, and retries, revealing when savings in individual calls are offset by repeated gathering, ineffective actions, or recovery."

call_intro: "The proposed Third Workshop on Efficient Reasoning at ICLR 2027 welcomes contributions on the design, training, evaluation, and deployment of efficient reasoning models and agent systems. We encourage work that connects reasoning quality with explicit resource budgets across internal model computation and complete agent workflows."
scope:
  - title: "Architectures and reasoning representations"
    description: "Looped Transformers, recurrent-depth models, weight sharing, Universal Transformers, equilibrium-based models, latent reasoning, and hybrid explicit–implicit architectures; adaptive depth and sparse or conditional computation, with attention to reasoning capacity and resource requirements."
  - title: "Theory and mechanistic understanding"
    description: "Expressivity, algorithmic generalization, recurrent-depth extrapolation, fixed-point convergence, stability, and representation dynamics; relationships among parameter count, effective depth, computational cost, and reasoning quality, including the distinction between state convergence and correctness."
  - title: "Algorithms and adaptive computation"
    description: "Learned halting, early exit, uncertainty-aware iteration, budget allocation, routing, search, speculative decoding, and selective verification; resource allocation across explicit reasoning, latent updates, exploration, and external tools, including allocation-policy overhead."
  - title: "Training, optimization, and data"
    description: "Efficient pretraining, fine-tuning, reinforcement learning, and distillation; recurrent optimization, curricula over task difficulty and depth, process supervision, synthetic data, and feedback from failed or recovered trajectories; training and data costs of learning transferable efficiency."
  - title: "Systems and infrastructure"
    description: "Training and serving support for dynamic-depth and long-context models: scheduling, batching, activation and memory management, KV-cache compression, quantization, parallelism, and hardware acceleration; translating model savings into latency, throughput, memory, and energy improvements."
  - title: "Agents and iterative improvement"
    description: "Resource-aware planning, tool use, retrieval, memory, context compression, caching, and multi-agent coordination; iterative refinement, feedback loops, and empirically evaluated self-improvement of policies, tools, or models, accounting for verification, communication, retries, and learning costs."
  - title: "Benchmarks and evaluation"
    description: "Quality–resource trade-offs under controlled parameter, compute, memory, latency, and energy budgets; generalization across difficulty and recurrence depth; complete task costs, reliability, and tail latency on realistic hardware and workloads, including training overhead and latent or external computation."
  - title: "Interpretability, robustness, and safety"
    description: "Monitoring and verification of explicit and latent reasoning; error propagation across iterations, safe stopping, uncertainty calibration, and robustness to distribution shifts or adversarial manipulation; effects of compression, distillation, and quantization on reliable decisions."
  - title: "Applications"
    description: "Mathematical reasoning, software engineering, scientific discovery, long-context and multimodal understanding, spatial reasoning, robotics, embodied agents, and on-device systems; constraints on response time, hardware, interaction costs, and successful task completion."

submission_guidelines:
  - title: "Paper format and page limit"
    description: "Single PDF using the ICLR LaTeX template, with 4–10 pages of main text, excluding references."
  - title: "Submission portal"
    description: "OpenReview. The workshop submission link will be announced."
  - title: "Review process and conflicts of interest"
    description: "Double-blind review through OpenReview. Submissions and supplementary materials must be anonymized. Reviewers and Program Committee members will declare conflicts; conflicted members will recuse themselves and papers will be reassigned in accordance with the ICLR Conflicts of Interest policy and Code of Conduct."
  - title: "Publication policy"
    description: "Workshop papers are non-archival. All accepted papers will be publicly available on OpenReview and imported into iclr.cc by February 26, 2027, 11:59 p.m. AoE."
  - title: "Presentation"
    description: "Accepted papers will be presented as posters, with three selected for contributed talks in the tentative program. Organizers will moderate sessions rather than give talks."
  - title: "Previously published work"
    description: "Submissions of work already published at major machine learning venues, including ICLR, ICML, and NeurIPS, are discouraged."
  - title: "LLM usage policy"
    description: "LLMs may be used as general-purpose assistance tools. Substantial contributions to research ideation or writing must be disclosed in a separate LLM Usage section, typically in an appendix excluded from the page limit, explaining their role. Failure to disclose significant usage may result in desk rejection. Authors remain fully responsible for all content, including LLM-generated text; LLMs cannot be credited as authors."

