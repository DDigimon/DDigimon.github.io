schedule_intro: "The tentative full-day, in-person program includes eight invited talks, three contributed talks, two poster sessions, and one panel discussion, with online access and accommodations for participants unable to attend in person. Invited talks are approximately 20 minutes and contributed talks 15 minutes, including Q&A; each poster session is 60 minutes and the panel is 45 minutes. Final timing will be coordinated with ICLR."
schedule:
  - time: "09:00–12:00"
    title: "Morning Session"
    description: "Opening remarks, four invited talks, one contributed talk, a poster session, and a coffee break."
  - time: "12:00–13:00"
    title: "Lunch Break"
    description: "Time for informal discussion and community exchange."
  - time: "13:00–17:00"
    title: "Afternoon Session"
    description: "Four invited talks, two contributed talks, a second poster session, a panel with audience Q&A on open challenges and future directions, a coffee break, and closing remarks."

community:
  - "We aim to support Ph.D. students, postdoctoral scholars, and researchers from underrepresented groups, with participation across regions, affiliations, research areas, and career stages. Contributed talks, posters, and discussion will provide opportunities to exchange feedback and build connections. Available sponsorship funds will prioritize attendance support for junior researchers."
  - "We plan to continue reviewer mentorship pairing junior and senior reviewers. Hybrid participation will combine live discussion with asynchronous access to recorded content across time zones. Recordings of invited and contributed talks and all accepted papers will be shared on the workshop website. A Zoom link will be provided later."

